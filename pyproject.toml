[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swolectl"
version = "0.1.0"
description = "Independent controller library for compatible strength-training hardware"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-pyserial>=3.5.0.20250326",
]

[project.scripts]
swolectl = "swolectl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swolectl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["swolectl"]
